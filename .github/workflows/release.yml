name: Release (manual rebuild)

# Automatic release binaries are built and attached inline by docker.yml
# whenever QpVersion changes on main (release events fired via GITHUB_TOKEN
# don't trigger other workflows, so a separate `release: created` listener
# here would never actually run). This workflow is a manual fallback to
# rebuild and re-attach binaries for an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag/release to (re)attach binaries to"
        required: true

permissions:
    contents: write
    packages: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: arm64
            goos: windows
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.tag }}
    - uses: wangyoucao577/go-release-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goversion: "1.26"
        project_path: "./src"
        binary_name: "quepasa"
        release_tag: ${{ inputs.tag }}
        extra_files: LICENSE.md README.md
